<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FaithfulMed cover</title>
  <desc id="desc">A medical source passes through fact extraction, plain-language writing, and verification before becoming a patient-friendly explanation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf5f4"/>
      <stop offset="1" stop-color="#dce9f4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f7fbfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#254b59" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1325" cy="95" r="205" fill="#d1e6e2" opacity=".58"/>
  <circle cx="190" cy="820" r="245" fill="#d6e2f0" opacity=".7"/>
  <rect x="115" y="95" width="1370" height="710" rx="44" fill="url(#card)" filter="url(#shadow)"/>
  <text x="180" y="178" fill="#183a45" font-family="Arial, sans-serif" font-size="31" font-weight="700">FaithfulMed</text>
  <text x="180" y="216" fill="#63808a" font-family="Arial, sans-serif" font-size="19">Medical text, explained with care and source fidelity</text>
  <rect x="178" y="286" width="302" height="374" rx="24" fill="#f0f6f6" stroke="#d8e6e5" stroke-width="2"/>
  <rect x="213" y="322" width="58" height="66" rx="12" fill="#d5e8e5"/>
  <path d="M230 339h24m-24 14h24m-24 14h16" stroke="#347a76" stroke-width="5" stroke-linecap="round"/>
  <text x="213" y="435" fill="#23444d" font-family="Arial, sans-serif" font-size="22" font-weight="700">Medical source</text>
  <path d="M213 472h224M213 501h194M213 530h211M213 559h155" stroke="#a8bdc0" stroke-width="8" stroke-linecap="round"/>
  <text x="213" y="615" fill="#63808a" font-family="Arial, sans-serif" font-size="17">Source-grounded facts</text>
  <path d="M505 472h92m-21-20 21 20-21 20" fill="none" stroke="#76a9a4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="625" y="315" width="215" height="310" rx="24" fill="#e6f2ef" stroke="#c9e1dc" stroke-width="2"/>
    <circle cx="732" cy="375" r="34" fill="#c3e1da"/>
    <path d="M718 375h28m-14-14v28" stroke="#347a76" stroke-width="6" stroke-linecap="round"/>
    <text x="732" y="450" fill="#23444d" font-size="20" font-weight="700">Extract</text>
    <text x="732" y="484" fill="#63808a" font-size="16">Identify facts</text>
    <text x="732" y="509" fill="#63808a" font-size="16">and key terms</text>
    <rect x="865" y="315" width="215" height="310" rx="24" fill="#eef0fa" stroke="#dbdff1" stroke-width="2"/>
    <circle cx="972" cy="375" r="34" fill="#d9dcf0"/>
    <path d="M958 367h28m-28 16h19" stroke="#626fa4" stroke-width="5" stroke-linecap="round"/>
    <text x="972" y="450" fill="#303d67" font-size="20" font-weight="700">Explain</text>
    <text x="972" y="484" fill="#747fa4" font-size="16">Write in clear,</text>
    <text x="972" y="509" fill="#747fa4" font-size="16">patient-friendly words</text>
    <rect x="1105" y="315" width="215" height="310" rx="24" fill="#f8f1e7" stroke="#ecdfc9" stroke-width="2"/>
    <circle cx="1212" cy="375" r="34" fill="#f0dfc1"/>
    <path d="m1198 375 10 10 19-21" fill="none" stroke="#a77a3e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1212" y="450" fill="#604b2c" font-size="20" font-weight="700">Verify</text>
    <text x="1212" y="484" fill="#9a8058" font-size="16">Check claims</text>
    <text x="1212" y="509" fill="#9a8058" font-size="16">against evidence</text>
