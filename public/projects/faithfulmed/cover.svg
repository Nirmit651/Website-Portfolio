  <rect x="1377" y="350" width="80" height="244" rx="22" fill="#e6f2ef"/>
  <path d="M1402 413c0-12 9-20 19-20s19 8 19 20c0 24-19 37-19 37s-19-13-19-37Z" fill="#9bc9bf"/>
  <path d="M1411 413h20m-10-10v20" stroke="#347a76" stroke-width="5" stroke-linecap="round"/>
  <path d="M1397 490h40m-40 21h31m-31 21h36" stroke="#91b3ae" stroke-width="6" stroke-linecap="round"/>
  <text x="1378" y="643" fill="#63808a" font-family="Arial, sans-serif" font-size="16">Clear answer</text>
</svg>
