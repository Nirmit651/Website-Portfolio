    <text x="1160" y="494" fill="#f0f9ff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="850">Object storage</text>
    <text x="1160" y="536" fill="#9cc4d7" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">S3-compatible</text>
    <rect x="1160" y="594" width="206" height="48" rx="24" fill="#0f766e"/>
    <text x="1211" y="625" fill="#ecfeff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850">SUPABASE</text>
  </g>
</svg>
